<script>
/* Theme sáng/tối — đặt ngay trong <head> để áp dụng TRƯỚC khi trang vẽ (không nháy màu).
   Lưu lựa chọn vào localStorage; lần đầu theo cài đặt hệ điều hành của máy. */
(function(){
  try{
    var t=localStorage.getItem('eiu-theme');
    if(t!=='dark'&&t!=='light') t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
function toggleTheme(){
  var next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('eiu-theme',next);}catch(e){}
}
</script>
<style>
:root{
  /* ── Bảng màu: 6 vai trò, mỗi màu MỘT nghĩa ─────────────────────────────
     xanh EIU  = khối thương hiệu (dải đầu trang, login, hero)
     accent    = hành động / liên kết / tương tác
     gold      = checkpoint cần kiểm
     đỏ        = LỖI (chỉ lỗi, không dùng cho vùng GV nữa)
     gv (slate)= vùng giảng viên chấm — trung tính, không "báo động"        */
  --ink:#16202b; --ink-soft:#586573; --line:#c2ccd6; --line-soft:#e4e9ee;
  --paper:#ffffff; --bg:#eaf0f5; --surface:#f2f6f9; --surface-hover:#e7eef3;
  --eiu:#123a6b; --eiu-dark:#0d2c52;
  --accent:#0693e3; --accent-dark:#0576b8; --accent-soft:#e5f4fd; --accent-line:#8ed1fc; --accent-text:#045a8c;
  --gold:#9c6a06; --gold-dark:#7a5405; --gold-soft:#fef6e0; --gold-line:#f0c869;
  --red:#c62828; --red-soft:#fdecec; --red-line:#f0b3ae;
  --green:#007a52; --green-soft:#e3f9f0; --green-line:#7bdcb5;
  --gv:#6d5b9c; --gv-dark:#574780; --gv-soft:#f0edf8; --gv-line:#c9bce4;
  --purple:#9b51e0;
  --th-q:#dde4e9; --mean-rl:#d8ecfb;
  --toast-bg:#1c2836;
  /* gradient cùng-tông EIU (không còn xanh→tím trang trí) */
  --grad-signature:linear-gradient(135deg, #123a6b 0%, #0f5aa0 100%);

  /* ── ẢNH CAMPUS Ở MÀN ĐĂNG NHẬP ───────────────────────────────────────
     Đặt file ảnh vào:  assets/login-campus.jpg  (tạo thư mục assets cạnh file này).
     Muốn đổi tên/đường dẫn: chỉ sửa đúng dòng dưới. Chưa có ảnh → tự dùng nền xanh EIU. */
  --login-bg:url('assets/login-campus.jpg');

  --grid:rgba(18,58,107,.055);   /* lưới ô ly cho .sheet — sổ tay thí nghiệm */

  --ui:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --doc:"Times New Roman",Times,serif;                 /* nội dung báo cáo — giữ chất tài liệu khoa học */
  --display:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
  --math:"Cambria Math","Times New Roman",serif;
  --radius:20px; --radius-sm:12px; --radius-xs:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.04);
  --shadow-md:0 6px 20px rgba(0,0,0,.09), 0 1px 3px rgba(0,0,0,.06);
  --shadow-lg:0 16px 40px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
}

/* ── DARK MODE: chỉ override GIÁ TRỊ token, không đổi cấu trúc ──────────── */
:root[data-theme="dark"]{
  --ink:#e6ecf2; --ink-soft:#9aa7b5; --line:#38434f; --line-soft:#2b3542;
  --paper:#1a2330; --bg:#111823; --surface:#212c3a; --surface-hover:#283444;
  --eiu:#1c4e8a; --eiu-dark:#123a6b;
  --accent:#3aa9ec; --accent-dark:#2b8fd0; --accent-soft:rgba(6,147,227,.16); --accent-line:rgba(58,169,236,.4); --accent-text:#8fcdf3;
  --gold:#e0b25a; --gold-dark:#c99a3f; --gold-soft:rgba(156,106,6,.20); --gold-line:rgba(224,178,90,.4);
  --red:#f0857f; --red-soft:rgba(198,40,40,.20); --red-line:rgba(240,133,127,.42);
  --green:#4dcfa0; --green-soft:rgba(0,122,82,.20); --green-line:rgba(77,207,160,.42);
  --gv:#b9a9e0; --gv-dark:#a08fd0; --gv-soft:rgba(109,91,156,.22); --gv-line:rgba(185,169,224,.4);
  --th-q:#2f3d4e; --mean-rl:#243449;
  --toast-bg:#2a3a4d;
  --grid:rgba(120,160,210,.07);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 20px rgba(0,0,0,.42);
  --shadow-lg:0 16px 40px rgba(0,0,0,.5);
}

/* PDF xuất ra LUÔN nền sáng như bản in — cô lập khỏi dark mode bằng cách
   khai báo lại token sáng trên chính host offscreen (không dùng selector con). */
.pdf-host{
  --ink:#16202b; --ink-soft:#586573; --line:#c2ccd6; --line-soft:#e4e9ee;
  --paper:#ffffff; --bg:#ffffff; --surface:#f2f6f9; --surface-hover:#e7eef3;
  --accent-soft:#e5f4fd; --accent-line:#8ed1fc; --accent-text:#045a8c;
  --gold:#9c6a06; --gold-soft:#fef6e0; --gold-line:#f0c869;
  --red:#c62828; --red-soft:#fdecec; --red-line:#f0b3ae;
  --green:#007a52; --green-soft:#e3f9f0; --green-line:#7bdcb5;
  --gv:#6d5b9c; --gv-soft:#f0edf8; --gv-line:#c9bce4;
  --th-q:#dde4e9; --mean-rl:#d8ecfb; --grid:rgba(18,58,107,.055);
  background:#fff;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:var(--ui);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;}
button{font-family:var(--ui);cursor:pointer;transition:background-color .15s ease,box-shadow .15s ease,border-color .15s ease,transform .05s ease;}
input,textarea,select{font-family:var(--ui);color:var(--ink);}
.hidden{display:none!important;}

.top-strip{height:4px;background:var(--grad-signature);}

/* Nền = ảnh campus EIU (full-bleed). Chưa có ảnh → tự rơi về nền xanh EIU. */
#loginScreen{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;background:var(--eiu-dark);}
#loginScreen::before{content:"";position:absolute;inset:0;background:var(--login-bg) center/cover no-repeat;}
#loginScreen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,22,42,.28) 0%,rgba(9,22,42,.52) 100%);}
.login-card{position:relative;z-index:2;background:var(--paper);border-radius:var(--radius);overflow:hidden;width:100%;max-width:400px;box-shadow:var(--shadow-lg);}
/* Header gọn, nằm trong card sáng — ảnh campus mới là điểm nhấn, card giữ trầm */
.login-band{background:var(--paper);padding:30px 30px 6px;position:relative;}
.login-band::after{content:"";position:absolute;left:30px;bottom:0;width:40px;height:3px;background:var(--gold);border-radius:2px;}
.login-logo{height:34px;width:auto;display:block;margin-bottom:14px;}
/* Logo có nền trong suốt, chữ navy — trên card tối cần lót nền trắng để đọc rõ */
:root[data-theme="dark"] .login-logo{background:#fff;padding:6px 10px;border-radius:8px;box-sizing:content-box;}
.login-card h1{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 5px;color:var(--ink);letter-spacing:-.01em;}
.login-card .sub{font-size:12.5px;color:var(--ink-soft);margin:0;}
.login-body{padding:28px 30px 30px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13.5px;background:var(--paper);transition:border-color .15s ease,box-shadow .15s ease;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:9px 18px;font-size:13.5px;font-weight:600;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--accent-dark);box-shadow:var(--shadow-md);}
.btn-primary:active{transform:translateY(1px);}
.btn-primary:disabled{background:#aab5bd;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:7px 14px;font-size:13px;font-weight:500;border-radius:var(--radius-sm);}
.btn-ghost:hover{background:var(--surface-hover);border-color:#b7c2ca;}
.btn-ghost:disabled{color:var(--ink-soft);cursor:not-allowed;}
.btn-gold{background:var(--gold);color:#fff;border:none;padding:9px 18px;font-size:13.5px;font-weight:600;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);}
.btn-gold:hover{background:var(--gold-dark);box-shadow:var(--shadow-md);}
.btn-gold:disabled{background:#cbb27a;box-shadow:none;cursor:not-allowed;}
.btn-sm{padding:5px 11px;font-size:12px;}
.login-hint{margin-top:18px;padding:11px 13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);font-size:11.5px;color:var(--ink-soft);line-height:1.75;}
.login-hint b{color:var(--ink);}
.err{color:var(--red);font-size:12.5px;margin-top:9px;}

.topbar{background:var(--paper);border-bottom:1px solid var(--line-soft);padding:0 22px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:40;box-shadow:var(--shadow-sm);}
.topbar .brand{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.005em;color:var(--eiu);}
.topbar .brand span{font-family:var(--ui);color:var(--ink-soft);font-weight:400;font-size:12px;margin-left:8px;}
.topbar .user{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink-soft);}
.topbar .user b{color:var(--ink);font-weight:600;}
.badge-role{background:var(--accent-soft);color:var(--accent-text);padding:3px 10px;font-size:11px;font-weight:600;border-radius:999px;border:1px solid var(--accent-line);}
.badge-role.admin{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line);}
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 60px;}
.wrap.wide{max-width:1320px;}

.crumbs{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
.crumbs a{color:var(--accent);cursor:pointer;font-weight:500;}
.crumbs a:hover{text-decoration:underline;}
.page-title{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px;padding-bottom:13px;position:relative;color:var(--ink);}
.page-title::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:4px;background:var(--grad-signature);border-radius:3px;}
.page-sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}

/* ---- Hero / dashboard chào mừng ---- */
.hero{position:relative;overflow:hidden;background:var(--grad-signature);color:#fff;border-radius:var(--radius);padding:22px 26px;margin-bottom:20px;box-shadow:var(--shadow-md);}
.hero h1{font-family:var(--display);font-size:23px;font-weight:700;margin:0 0 4px;color:#fff;letter-spacing:-.01em;}
.hero .hsub{font-size:13px;color:rgba(255,255,255,.86);margin:0;}
.hero .hmeta{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap;}
.hchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;color:#fff;}
.hchip svg{width:14px;height:14px;flex:0 0 auto;opacity:.92;}
.hero-art{position:absolute;right:-4px;bottom:-24px;width:158px;height:158px;opacity:.14;pointer-events:none;color:#fff;}
.hero-art svg{width:100%;height:100%;}

/* icon nằm cạnh chữ trong nút hành động chính */
.btn-primary,.btn-gold,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn-primary svg,.btn-gold svg,.btn-ghost svg{width:15px;height:15px;flex:0 0 auto;}

.panel{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);margin-bottom:18px;box-shadow:var(--shadow-sm);overflow:hidden;}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--surface);}
.panel-head h3{margin:0;font-size:14px;font-weight:600;}
.panel-head .note{font-size:11.5px;color:var(--ink-soft);}
.panel-body{padding:20px;}
.panel-body.flush{padding:0;}

table.list{width:100%;border-collapse:collapse;font-size:13px;}
table.list th{background:var(--surface);text-align:left;padding:10px 16px;font-size:12px;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--line-soft);}
table.list td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.list tr:last-child td{border-bottom:none;}
table.list tr.clickable{cursor:pointer;transition:background-color .1s ease;}
table.list tr.clickable:hover td{background:var(--surface-hover);}
.muted{color:var(--ink-soft);}
.tiny{font-size:11.5px;}

.status{display:inline-block;padding:3px 11px;font-size:11px;font-weight:600;letter-spacing:.01em;border-radius:999px;border:1px solid;white-space:nowrap;}
.status.draft{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line);}
.status.empty{background:var(--surface);color:var(--ink-soft);border-color:var(--line);}
.status.submitted{background:var(--green-soft);color:var(--green);border-color:var(--green-line);}
.status.graded{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-line);}

.alert{padding:12px 15px;font-size:12.5px;border:1px solid;border-left-width:4px;border-radius:var(--radius-sm);margin-bottom:16px;line-height:1.65;}
.alert.info{background:var(--accent-soft);border-color:var(--accent-line);border-left-color:var(--accent);color:var(--accent-text);}
.alert.warn{background:var(--gold-soft);border-color:var(--gold-line);border-left-color:var(--gold);color:var(--gold-dark);}
.alert.ok{background:var(--green-soft);border-color:var(--green-line);border-left-color:var(--green);color:var(--green);}
.alert.bad{background:var(--red-soft);border-color:var(--red-line);border-left-color:var(--red);color:var(--red);}

.actionbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.actionbar .spacer{flex:1;}

.admin-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);margin-bottom:20px;flex-wrap:wrap;}
.admin-tab{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:500;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:var(--radius-xs) var(--radius-xs) 0 0;}
.admin-tab:hover{background:var(--surface-hover);color:var(--ink);}
.admin-tab.active{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:600;background:var(--accent-soft);}

.doc-toolbar{position:sticky;top:54px;z-index:30;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
.pal-tabs{display:flex;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
.pal-tab{font-size:11.5px;padding:6px 10px;border:none;border-right:1px solid var(--line-soft);background:var(--surface-hover);color:var(--ink-soft);}
.pal-tab.active{background:var(--paper);color:var(--ink);font-weight:600;}
.pal-body{max-height:100px;overflow-y:auto;padding:7px 8px;background:var(--surface);}
.pal-grid{display:none;flex-wrap:wrap;gap:4px;}
.pal-grid.active{display:flex;}
.pal-grid button{font-family:var(--math);font-size:15px;min-width:34px;height:30px;padding:0 6px;border:1px solid var(--line-soft);border-radius:var(--radius-xs);background:var(--paper);color:var(--ink);line-height:1;}
.pal-grid button:hover{background:var(--accent-soft);border-color:var(--accent);}
.pal-note{font-size:11px;color:var(--ink-soft);padding:6px 9px;background:var(--bg);border-top:1px solid var(--line-soft);}

.sheet{
  /* Signature: nền lưới ô ly như trang sổ tay thí nghiệm (rất nhạt, 24px).
     Các ô nhập/bảng/khối văn bản đều có nền riêng nên chỉ thấy lưới ở lề & khe. */
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 -1px / 100% 24px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) -1px 0 / 24px 100%,
    var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);padding:34px 40px 44px;
  font-family:var(--doc);box-shadow:var(--shadow-md);   /* nổi hơn .panel (shadow-sm) để mắt biết đâu là trọng tâm */
}
.sheet .dtitle{text-align:center;font-family:var(--ui);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 5px;}
.sheet .dhead{text-align:center;font-size:20px;font-weight:700;margin:0 0 3px;}
.sheet .dsub{text-align:center;font-size:13.5px;font-style:italic;color:var(--ink-soft);margin:0 0 22px;}

table.info{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:13.5px;}
table.info td{border:1px solid var(--line-soft);padding:6px 10px;vertical-align:top;}
table.info .lb{color:var(--ink-soft);width:172px;font-family:var(--ui);font-size:13px;}
table.info input{width:100%;border:none;background:transparent;border-bottom:1px dotted var(--line);font-family:var(--doc);font-size:13.5px;padding:3px 0;}
table.info input:focus{outline:none;border-bottom:1px solid var(--accent);}
.gv-cell{background:var(--gv-soft);width:236px;}
.gv-label{font-family:var(--ui);font-size:12px;color:var(--gv-dark);font-weight:700;margin-bottom:5px;}
.gv-area{min-height:104px;border:1px solid var(--gv-line);border-radius:var(--radius-xs);background:var(--paper);padding:6px 8px;font-family:var(--doc);font-size:13px;line-height:1.6;}
.gv-area:focus{outline:none;border-color:var(--gv);box-shadow:0 0 0 3px var(--gv-soft);}
.name-warn{font-family:var(--ui);font-size:10.5px;color:var(--red);margin-top:3px;display:block;}

.sec{margin-bottom:30px;}
.sec-title{font-size:15.5px;font-weight:700;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin:0 0 13px;}
.sub-title{font-size:14px;font-weight:700;margin:22px 0 9px;}
.subsub{font-size:13px;font-weight:700;font-style:italic;color:var(--ink-soft);margin:19px 0 8px;}

.rich{width:100%;border:1px solid var(--line-soft);border-radius:var(--radius-xs);background:var(--paper);font-family:var(--doc);font-size:13.5px;line-height:2;padding:10px 12px;color:var(--ink);}
.rich:focus{outline:none;border-color:var(--accent);background:var(--paper);}
.rich.task{min-height:120px;}
.rich.work{min-height:110px;}
.work-label{font-family:var(--ui);font-size:13px;color:var(--ink-soft);font-style:italic;margin:0 0 5px;}
.inline-mf{display:inline-block;vertical-align:-4px;min-width:24px;border:1px solid var(--line);background:var(--paper);padding:1px 6px;margin:0 2px;border-radius:6px;}

.mat-tabs{display:flex;gap:6px;margin-bottom:14px;}
.mat-tab{font-family:var(--ui);font-size:12.5px;padding:7px 15px;border:1px solid var(--line-soft);border-radius:var(--radius-xs) var(--radius-xs) 0 0;background:var(--surface);color:var(--ink-soft);border-bottom:none;}
.mat-tab.active{background:var(--paper);color:var(--ink);font-weight:600;border-color:var(--ink-soft);}
.mat-panel{display:none;border-top:1px solid var(--ink-soft);padding-top:16px;}
.mat-panel.active{display:block;}

.instr{font-family:var(--ui);font-size:13px;color:var(--ink-soft);line-height:1.9;margin-bottom:12px;}
.instr input{width:66px;border:none;border-bottom:1px dotted var(--line);background:transparent;font-family:var(--doc);font-size:13px;padding:2px 4px;text-align:center;color:var(--ink);}
.instr input:focus{outline:none;border-bottom:1px solid var(--accent);}

.tscroll{overflow-x:auto;margin-bottom:8px;border-radius:var(--radius-xs);}
table.data{width:100%;min-width:760px;border-collapse:collapse;font-size:13px;}
table.data th,table.data td{border:1px solid var(--line-soft);padding:5px 3px;text-align:center;}
table.data th{background:var(--surface);font-family:var(--ui);font-weight:600;font-size:12px;}
table.data th.q{background:var(--th-q);}
table.data .rl{background:var(--surface);font-family:var(--ui);font-weight:600;width:58px;font-size:12px;}
table.data input{width:100%;min-width:44px;border:none;background:transparent;text-align:center;font-family:var(--doc);font-size:13px;padding:3px 0;}
table.data input:focus{outline:none;background:var(--accent-soft);}
table.data td.dc{background:var(--gold-soft);}
table.data tr.mean td{background:var(--accent-soft);}
table.data tr.mean .rl{background:var(--mean-rl);}

.cpbox{border:1px solid var(--gold-line);border-radius:var(--radius-sm);background:var(--gold-soft);padding:11px 14px;margin:10px 0 22px;}
.cptitle{font-family:var(--ui);font-size:11.5px;font-weight:700;color:var(--gold-dark);margin-bottom:9px;}
.cpgrid{display:flex;flex-wrap:wrap;gap:8px 16px;}
.cpitem{display:flex;align-items:center;gap:6px;flex:1 1 240px;}
.cpitem label{font-family:var(--math);font-size:13.5px;min-width:46px;flex:0 0 auto;}
.cpf{flex:1 1 auto;min-height:29px;border:1px solid var(--gold-line);border-radius:var(--radius-xs);background:var(--paper);padding:4px 8px;font-size:14px;}
.cpf:focus-within{border-color:var(--gold);}
.cpu{width:80px;flex:0 0 auto;border:1px dashed var(--gold-line);border-radius:var(--radius-xs);background:var(--paper);font-family:var(--math);font-size:12px;padding:5px 6px;color:var(--ink-soft);text-align:center;}
.cpu:focus{outline:none;border-color:var(--gold);border-style:solid;color:var(--ink);}

/* Ô đối chiếu — chỉ hiện khi GV chấm */
.calcbox{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius-xs);padding:4px 9px;font-family:var(--math);font-size:12.5px;color:var(--accent-text);white-space:nowrap;}
.calcbox .tagc{font-family:var(--ui);font-size:11px;font-weight:700;color:var(--accent-text);}
.cpgrid.grading .cpitem{flex:1 1 100%;}

.resbox{border:1.5px solid var(--gold-line);border-radius:var(--radius-sm);background:var(--gold-soft);padding:14px 16px;margin-top:12px;}
.resline{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.resline:last-child{margin-bottom:0;}
.resline .rt{font-family:var(--math);font-size:14px;font-weight:700;min-width:124px;}
.resline .cpf{flex:1 1 190px;min-height:31px;border-color:var(--gold-line);}
.resline .cpu{border-color:var(--gold-line);width:94px;}

.ol{background-image:linear-gradient(currentColor,currentColor);background-size:100% 1px;background-repeat:no-repeat;background-position:top;padding-top:1.5px;}

/* Phân số thật (LabUtils.frac) — tử số/mẫu số xếp chồng, gạch ngang ở giữa,
   dùng trong văn bản hướng dẫn công thức thay cho viết liền bằng dấu "/".
   vertical-align:middle để gạch phân số luôn canh giữa các ký hiệu đứng cạnh
   nó ("=", "+", "Σ", ...) — trước dùng -0.4em (cố định) khiến các ký hiệu đó
   luôn bị lệch xuống thấp so với phân số ở MỌI bài (đã kiểm tra lại Bài 1-5
   và 6A/6B, lỗi giống hệt nhau vì cùng dùng chung .mfrac này); middle sửa
   đúng gốc, áp dụng chung cho toàn hệ thống thay vì override riêng lẻ. */
.mfrac{display:inline-block;vertical-align:middle;line-height:1.15;margin:0 4px;text-align:center;}
.mfrac .mfrac-n{display:block;border-bottom:1.2px solid currentColor;padding:0 3px 1px;}
.mfrac .mfrac-d{display:block;padding:5px 3px 0;}
.mrow{display:inline-block;}

/* Dòng công thức đứng riêng (không nằm trong .hint) — dùng khi 1 dòng có
   nhiều phân số/công thức cần đọc rõ, giống cách trình bày công thức trong
   tài liệu Word gốc (chữ đứng, không nghiêng, cỡ chữ lớn hơn .hint, khoảng
   cách giữa các cụm công thức rộng hơn mặc định của .mfrac). Dùng cho khối
   công thức đứng thành đoạn riêng (Bài 6A/6B). */
.formula-line{font-family:var(--math);font-style:normal;font-size:14px;color:var(--ink);line-height:2.4;margin:8px 0 14px;}
.formula-line .mfrac{margin:0 8px;}

/* Khối công thức đứng riêng NẰM TRONG .work-label/.hint (Bài 1-5) — label vẫn
   nghiêng/xám như cũ, chỉ riêng khối công thức (đặt trong <span class="mformula">,
   thường sau <br>) đứng thẳng/đen giống .formula-line, để khớp cách trình bày
   công thức trong tài liệu Word gốc. */
.mformula{font-family:var(--math);font-style:normal;font-size:13.5px;color:var(--ink);}
.mformula .mfrac{margin:0 8px;}

.hint{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);font-style:italic;margin:4px 0 13px;}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend i{width:12px;height:12px;display:inline-block;border:1px solid;border-radius:5px;}

/* ---- Real-time presence ---- */
.rt-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px 13px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.rt-bar .rt-label{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.rt-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:rtpulse 1.4s infinite;}
@keyframes rtpulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.rt-chips{display:flex;gap:7px;flex-wrap:wrap;}
.rt-chip{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;font-size:11.5px;color:var(--accent-text);}
.rt-chip.me{background:var(--paper);border-style:dashed;color:var(--ink-soft);}
.rt-pdot{width:7px;height:7px;border-radius:50%;}
input.sync-flash,[contenteditable].sync-flash,.mf.sync-flash{background:var(--green-soft)!important;transition:background .6s;}

#fabInsert{position:fixed;right:18px;bottom:18px;z-index:35;background:var(--accent);color:#fff;border:none;padding:10px 16px;font-size:12.5px;font-weight:600;border-radius:999px;box-shadow:var(--shadow-lg);}
#fabInsert:hover{background:var(--accent-dark);}

/* Thanh chấm điểm cố định */
.gradebar{position:sticky;bottom:0;z-index:36;background:var(--paper);border:1px solid var(--line-soft);border-top:2px solid var(--accent);border-radius:var(--radius) var(--radius) 0 0;padding:14px 18px;margin-top:18px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.08);}
.gradebar .gfield{flex:0 0 auto;}
.gradebar .gfield label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
.gradebar .score-in{width:110px;padding:8px 10px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:15px;text-align:center;font-weight:600;}
.gradebar .note-in{flex:1 1 300px;padding:8px 10px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;min-height:38px;font-family:var(--ui);}
.gradebar .spacer{flex:1;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(1px);}
.modal{background:var(--paper);border-radius:var(--radius);width:100%;max-width:620px;box-shadow:var(--shadow-lg);overflow:hidden;}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--line-soft);background:var(--surface);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:14.5px;font-weight:600;font-family:var(--display);}
.modal-head button{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;border-radius:var(--radius-xs);padding:2px 6px;}
.modal-head button:hover{background:var(--line-soft);color:var(--ink);}
.modal-body{padding:22px;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line-soft);background:var(--surface);display:flex;justify-content:flex-end;gap:9px;}
.kv{display:flex;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
.kv .k{color:var(--ink-soft);min-width:170px;}
.kv:last-child{border-bottom:none;}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.form-row .field{flex:1 1 180px;margin-bottom:0;}

/* ---- Thông báo trạng thái (đang tải / đã lưu / lỗi) ---- */
#toastHost{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{display:flex;align-items:center;gap:10px;background:var(--toast-bg);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);min-width:220px;max-width:380px;animation:toastIn .18s ease;}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}
.toast .tspin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:tspin .7s linear infinite;flex:0 0 auto;}
.toast .ticon{flex:0 0 auto;font-size:13px;line-height:1;}
@keyframes tspin{to{transform:rotate(360deg);}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---- Overlay chặn thao tác khi đang xử lý toàn trang ---- */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--ink-soft);font-size:13px;}
.page-loading .tspin-lg{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:tspin .7s linear infinite;}

/* ---- Nút chuyển giao diện Sáng / Tối ---- */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;flex:0 0 auto;padding:0;}
.theme-toggle:hover{background:var(--surface-hover);color:var(--ink);border-color:var(--accent-line);}
.theme-toggle svg{width:17px;height:17px;}
.theme-toggle .icon-moon{display:none;}
:root[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
:root[data-theme="dark"] .theme-toggle .icon-moon{display:inline;}
.login-theme{position:absolute;top:18px;right:18px;z-index:3;background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.6);color:#334;}
:root[data-theme="dark"] .login-theme{background:rgba(28,38,53,.88);border-color:rgba(255,255,255,.22);color:#e6ecf2;}

/* ---- Responsive: điện thoại (SV hay dùng) ---- */
@media (max-width:640px){
  .wrap{padding:18px 14px 48px;}
  .topbar{height:auto;padding:9px 14px;flex-wrap:wrap;gap:8px;}
  .topbar .brand{font-size:14px;}
  .topbar .brand span{display:block;margin-left:0;margin-top:2px;}
  .topbar .user{gap:10px;font-size:12px;flex-wrap:wrap;}
  .page-title{font-size:21px;}
  .page-sub{font-size:12.5px;}
  .sheet{padding:22px 15px 30px;border-radius:var(--radius-sm);}
  .panel-body{padding:16px;}
  .panel-head{padding:12px 15px;}
  .actionbar{gap:8px;}
  .actionbar .btn-gold,.actionbar .btn-primary{flex:1 1 100%;}
  .cpitem{flex:1 1 100%;}
  .gradebar{flex-direction:column;align-items:stretch;gap:10px;}
  .gradebar .gfield{flex:1 1 auto;}
  .gradebar .score-in,.gradebar .note-in{width:100%;}
  .modal-bg{padding:16px 10px;}
  #fabInsert{right:12px;bottom:12px;padding:9px 14px;font-size:12px;}
  .doc-toolbar{top:0;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
</style>
</head>

/* =====================================================================
   ĐIỂM RÁP NỐI MODULE BÀI THÍ NGHIỆM
   ---------------------------------------------------------------------
   Mỗi bài lab (Bài 1, Bài 2... của mỗi môn) là 1 "module" độc lập, đăng ký
   vào registry này bằng registerLabModule(course, labNo, module).
   Phần lõi hệ thống (đăng nhập, nhóm, real-time, nộp bài, chấm điểm,
   tổng hợp điểm) KHÔNG cần biết trước cấu trúc từng bài — chỉ gọi qua
   3 điểm chuẩn dưới đây. Thêm bài mới = viết 1 module mới theo đúng
   khuôn này, không phải sửa code lõi.

   module = {
     title: string                         // tên hiển thị
     buildDoc: function(mode) -> htmlString // mode: 'edit' | 'view' | 'grade'
                                             // trả về HTML của toàn bộ báo cáo,
                                             // mọi ô nhập PHẢI có data-f="..." (input/HTML)
                                             // hoặc data-mf="..." (công thức MathQuill),
                                             // key phải là duy nhất trong phạm vi 1 báo cáo.
     compute: function(fields) -> {key: 'giá trị hiển thị', ...}
                                             // fields = toàn bộ data-f dạng input hiện có.
                                             // Trả về giá trị hệ thống tự tính cho mỗi ô chốt,
                                             // key trùng với id dùng trong data-calc="key"
                                             // được chèn cạnh ô chốt tương ứng trong buildDoc.
   }
   ===================================================================== */
var LAB_MODULES={};
function registerLabModule(course,labNo,module){ LAB_MODULES[course+'-'+labNo]=module; }
function getLabModule(course,labNo){ return LAB_MODULES[course+'-'+labNo]; }

/* labsForCourse: danh sách bài của 1 môn dùng để hiển thị (trang "Danh sách
   bài", trang admin "Template", nộp cả kỳ...) — gộp DB.labs[course] (khai báo
   tay, dùng để giữ chỗ "(chưa cấu hình)" hoặc ép thứ tự/tiêu đề cụ thể) với
   MỌI labNo đã registerLabModule() cho môn đó nhưng chưa có trong DB.labs.
   Nhờ vậy, thêm 1 bài mới về sau chỉ cần viết 1 file JS gọi
   registerLabModule() — không cần sửa DB.labs trong file HTML nữa, đúng tinh
   thần "thêm bài mới không phải sửa code lõi" đã ghi ở đầu file. */
function labsForCourse(course){
  var declared=DB.labs[course]||[];
  var seen={}; declared.forEach(function(l){ seen[String(l.no)]=true; });
  var extra=[], prefix=course+'-';
  Object.keys(LAB_MODULES).forEach(function(key){
    if(key.slice(0,prefix.length)!==prefix) return;
    var raw=key.slice(prefix.length);
    if(seen[raw]) return;
    seen[raw]=true;
    var no=(/^-?\d+$/.test(raw)) ? parseInt(raw,10) : raw;
    extra.push({no:no, title:LAB_MODULES[key].title||('Bài '+no), hasTemplate:true});
  });
  extra.sort(function(a,b){
    var an=Number(a.no), bn=Number(b.no);
    if(isFinite(an)&&isFinite(bn)) return an-bn;
    return String(a.no).localeCompare(String(b.no));
  });
  return declared.concat(extra);
}

function normName(s){return (s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function checkMembers(report){
  var ms=membersOf(report.groupId);
  var listed=[];
  for(var i=1;i<=5;i++){
    var v=report.data&&report.data.fields?report.data.fields['info-name'+i]:'';
    if(v&&v.trim()) listed.push(v.trim());
  }
  var ln=listed.map(normName);
  var credited=ms.filter(function(m){return ln.indexOf(normName(m.name))>=0;});
  var missing=ms.filter(function(m){return ln.indexOf(normName(m.name))<0;});
  var unknown=listed.filter(function(x){return !ms.some(function(m){return normName(m.name)===normName(x);});});
  return {listed:listed,credited:credited,missing:missing,unknown:unknown};
}

var GAS_URL = 'https://script.google.com/macros/s/AKfycbz6MTkdrN69JzcjEbrm1Rlvf20TJY0jGKYhA9_Azo6nVfXkgcFXOZ4KJeltbEQoYM8/exec';

function gasGet(action, params){
  var qs = Object.keys(params||{}).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  }).join('&');
  var url = GAS_URL + '?action=' + encodeURIComponent(action) + (qs?('&'+qs):'');
  return fetch(url).then(function(r){ return r.json(); });
}
function gasPost(action, payload){
  var body = Object.assign({action:action}, payload||{});
  return fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},   // cố ý dùng text/plain để tránh preflight CORS
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}

/* =================== THÔNG BÁO TRẠNG THÁI (đang tải / đã lưu / lỗi) ===================
   showToast(msg,'loading') -> trả về id, dùng với updateToast(id,...) khi có kết quả.
   showToast(msg,'success'|'error') -> tự đóng sau vài giây. */
var toastSeq=0;
function toastMarkup(msg,type){
  var icon = type==='success' ? '<span class="ticon">✓</span>'
           : type==='error'   ? '<span class="ticon">✕</span>'
           : '<span class="tspin"></span>';
  return icon+'<span>'+msg+'</span>';
}
function showToast(msg,type){
  var host=document.getElementById('toastHost');
  var id='toast-'+(++toastSeq);
  var div=document.createElement('div');
  div.className='toast'+(type==='success'?' success':type==='error'?' error':'');
  div.id=id;
  div.innerHTML=toastMarkup(msg,type);
  host.appendChild(div);
  if(type==='success') setTimeout(function(){ dismissToast(id); }, 2200);
  if(type==='error') setTimeout(function(){ dismissToast(id); }, 4500);
  return id;
}
function updateToast(id,msg,type){
  var el=document.getElementById(id);
  if(!el) return showToast(msg,type);
  el.className='toast'+(type==='success'?' success':type==='error'?' error':'');
  el.innerHTML=toastMarkup(msg,type);
  if(type==='success') setTimeout(function(){ dismissToast(id); }, 2200);
  if(type==='error') setTimeout(function(){ dismissToast(id); }, 4500);
}
function dismissToast(id){
  var el=document.getElementById(id);
  if(el) el.remove();
}

/* Tải Lớp/Nhóm/Tài khoản/trạng thái báo cáo từ Sheet, ghi đè vào DB cục bộ.
   Lưu ý: bootstrap KHÔNG tải nội dung chi tiết từng báo cáo (data) — việc đó
   thuộc Đợt 2 (getReport khi mở 1 báo cáo cụ thể). */
function loadBootstrap(){
  return gasGet('bootstrap', {}).then(function(res){
    DB.users   = res.users   || [];
    DB.classes = res.classes || [];
    DB.groups  = res.groups  || [];
    DB.reports = (res.reports || []).map(function(r){
      return { groupId:r.groupId, course:r.course, lab:r.lab, status:r.status,
        data:null, lastEditBy:r.lastEditBy||null, lastEditAt:r.lastEditAt||null,
        submittedAt:r.submittedAt||null, grade: r.grade };
    });
  });
}

/* Tải nội dung chi tiết 1 báo cáo cụ thể (Đợt 2). Có cache trong phiên: nếu đã tải rồi
   thì dùng lại, không gọi lại backend. */
function ensureReportData(groupId,course,lab){
  var r=ensureReport(groupId,course,lab);
  if(r.data) return Promise.resolve(r.data);
  return gasGet('getReport',{groupId:groupId,course:course,lab:lab}).then(function(res){
    r.data = res.data || null;
    if(res.status) r.status = res.status;
    if(res.grade!==undefined) r.grade = res.grade;
    return r.data;
  });
}

function confirmSubmitAll(){
  var g=groupOf(S.user.groupId),labs=labsForCourse(g.course),ms=membersOf(g.id);
  var notDone=labs.filter(function(l){var r=reportOf(g.id,g.course,l.no);return !r||r.status==='empty';});
  var noName=[];
  labs.forEach(function(l){
    var r=ensureReport(g.id,g.course,l.no),mc=checkMembers(r);
    if(mc.missing.length>0) noName.push({lab:l.no,miss:mc.missing.map(function(m){return m.name;})});
  });
  var h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:560px;">';
  h+='<div class="modal-head"><h3>Xác nhận nộp báo cáo cuối kỳ</h3><button onclick="closeModal()">×</button></div><div class="modal-body">';
  h+='<p style="margin-top:0;font-size:13px;line-height:1.7;">Cả 5 bài của <b>'+g.name+'</b> sẽ được nộp cùng lúc và <b>khóa lại</b>. Thời gian nộp ghi theo giờ máy chủ.</p>';
  if(notDone.length>0) h+='<div class="alert warn"><b>Còn '+notDone.length+' bài chưa làm:</b> '+notDone.map(function(l){return 'Bài '+l.no;}).join(', ')+'.</div>';
  if(noName.length>0){
    h+='<div class="alert bad"><b>Thiếu tên thành viên — sẽ không được tính điểm:</b><br>';
    noName.forEach(function(x){h+='Bài '+x.lab+': '+x.miss.join(', ')+'<br>';});
    h+='</div>';
  }
  h+='</div><div class="modal-foot"><button class="btn-ghost" onclick="closeModal()">Hủy</button>';
  h+='<button class="btn-gold" onclick="doSubmitAll()">Xác nhận nộp</button></div></div></div>';
  document.getElementById('modalHost').innerHTML=h;
}
function doSubmitAll(){
  var g=groupOf(S.user.groupId);
  var btn=document.querySelector('.modal-foot .btn-gold');
  if(btn){ btn.disabled=true; btn.textContent='Đang nộp…'; }
  var tId=showToast('Đang nộp báo cáo cuối kỳ…','loading');
  gasPost('submitAll',{groupId:g.id, course:g.course}).then(function(res){
    if(!res||!res.ok){
      updateToast(tId,'Nộp bài thất bại — thử lại.','error');
      if(btn){btn.disabled=false;btn.textContent='Xác nhận nộp';}
      return;
    }
    labsForCourse(g.course).forEach(function(l){
      var r=ensureReport(g.id,g.course,l.no); r.status='submitted'; r.submittedAt=res.submittedAt;
    });
    updateToast(tId,'Đã nộp báo cáo cuối kỳ.','success');
    closeModal(); goLabs();
  }).catch(function(err){
    updateToast(tId,'Không kết nối được máy chủ.','error');
    console.error(err);
    if(btn){btn.disabled=false;btn.textContent='Xác nhận nộp';}
  });
}
function closeModal(){document.getElementById('modalHost').innerHTML='';}

function goReport(labNo){
  closeReportChannel();
  var g=groupOf(S.user.groupId);S.lab=labNo;
  var mod=getLabModule(g.course,labNo);
  if(!mod){ setView('<div class="alert warn">Bài này chưa có mẫu báo cáo (module) được cấu hình.</div>'); return; }
  var r=ensureReport(g.id,g.course,labNo);
  var locked=(r.status==='submitted'||r.status==='graded');

  var h='<div class="crumbs"><a onclick="goLabs()">Danh sách bài</a> › Bài '+labNo+'</div>';
  h+='<div class="actionbar"><div>';
  h+='<div style="font-size:16px;font-weight:600;">Bài '+labNo+' — '+mod.title+'</div>';
  h+='<div class="tiny muted" style="margin-top:3px;">'+g.name+' · Sửa lần cuối: '+fmtDT(r.lastEditAt)+(r.lastEditBy?' bởi '+userName(r.lastEditBy):'')+'</div>';
  h+='</div><div class="spacer"></div>';
  if(locked){h+='<span class="status submitted">Đã nộp lúc '+fmtDT(r.submittedAt)+'</span> <button class="btn-ghost btn-sm" onclick="exportReportPdf(\''+g.id+'\',\''+g.course+'\','+labNo+')">Tải PDF</button>';}
  else{h+='<span id="saveState" class="tiny muted">Đang tải nội dung…</span><button class="btn-primary" onclick="saveDraft()">'+ic('save')+'Lưu tạm</button>';}
  h+='</div>';

  if(locked) h+='<div class="alert ok">Báo cáo đã nộp — chỉ xem, không sửa được.</div>';
  if(!locked) h+='<div class="alert bad hidden" id="nameWarnBox"></div>';

  if(!locked){
    h+='<div class="rt-bar"><span class="rt-label"><span class="rt-dot"></span>Đồng bộ trực tiếp — mọi thay đổi hiện ngay cho người khác, không cần chờ Lưu tạm</span>';
    h+='<div class="rt-chips" id="rtChips"></div></div>';
  }

  h+='<div class="legend"><span><i style="background:#fffefb;border-color:#e6ebef;"></i> Vùng trình bày tự do</span>';
  h+='<span><i style="background:#fdf6e0;border-color:#dcc887;"></i> Ô chốt — kết quả bắt buộc</span></div>';
  h+=buildPalette();
  h+='<div id="docRoot">'+mod.buildDoc(locked?'view':'edit')+'</div>';
  setView(h);
  initPalette();
  REALTIME_ON=!locked;
  initDoc(locked,false);
  showFab(!locked);

  ensureReportData(g.id,g.course,labNo).then(function(data){
    if(S.lab!==labNo) return; // đã điều hướng sang trang khác trong lúc chờ tải
    if(data) loadDocData(data);
    var st=document.getElementById('saveState'); if(st) st.textContent='Đã lưu';

    var mc=checkMembers(r);
    var warnBox=document.getElementById('nameWarnBox');
    if(warnBox){
      if(!locked && mc.missing.length>0){
        warnBox.innerHTML='<b>Chưa ghi tên:</b> '+mc.missing.map(function(m){return m.name;}).join(', ')+'. Thành viên không có tên trong báo cáo sẽ không được tính điểm bài này.';
        warnBox.classList.remove('hidden');
      }
    }
    if(mod.afterRender){ try{ mod.afterRender(locked?'view':'edit'); }catch(e){ console.error('afterRender lỗi:',e); } }
    if(!locked) openReportChannel(g.id,g.course,labNo);
  }).catch(function(err){
    console.error('Không tải được nội dung báo cáo:',err);
    var st=document.getElementById('saveState'); if(st) st.textContent='Không tải được nội dung cũ — kiểm tra mạng';
    if(!locked) openReportChannel(g.id,g.course,labNo);
  });
}

function initPalette(){

    var gr=document.createElement('div');gr.className='pal-grid'+(i===0?' active':'');gr.dataset.idx=i;

    t.querySelectorAll('.pal-tab').forEach(function(y){y.classList.remove('active');});

    x.classList.add('active');b.querySelector('.pal-grid[data-idx="'+x.dataset.idx+'"]').classList.add('active');b.scrollTop=0;};

}

/* =================== REAL-TIME (Firebase Realtime Database) =================== */
var REALTIME_ON=false;
var reportRef=null, presenceRef=null;
var myTabId='tab-'+Math.random().toString(36).slice(2,9);
var rtPresence={};

function openReportChannel(gid,course,lab){
  var path='reports/'+gid+'-'+course+'-'+lab;
  reportRef=firebase.database().ref(path+'/fields');
  presenceRef=firebase.database().ref(path+'/presence');

  reportRef.on('value', function(snap){
    var all=snap.val()||{};
    Object.keys(all).forEach(function(key){
      var entry=all[key];
      if(entry.by===myTabId) return;
      applyRemoteField(entry.key, entry.kind, entry.value);
    });
  });

  var myPresenceRef=presenceRef.child(myTabId);
  myPresenceRef.set({name:S.user.name, ts:firebase.database.ServerValue.TIMESTAMP});
  myPresenceRef.onDisconnect().remove();

  presenceRef.on('value', function(snap){
    var all=snap.val()||{};
    rtPresence={};
    Object.keys(all).forEach(function(id){ if(id!==myTabId) rtPresence[id]=all[id]; });
    renderRtChips();
  });
}
function closeReportChannel(){
  if(presenceRef){ presenceRef.child(myTabId).remove(); presenceRef.off(); presenceRef=null; }
  if(reportRef){ reportRef.off(); reportRef=null; }
  rtPresence={}; REALTIME_ON=false;
}
function renderRtChips(){
  var box=document.getElementById('rtChips'); if(!box) return;
  var ids=Object.keys(rtPresence);
  var h='<span class="rt-chip me"><span class="rt-pdot" style="background:#0693e3;"></span>'+S.user.name+' (bạn)</span>';
  ids.forEach(function(id){
    h+='<span class="rt-chip"><span class="rt-pdot" style="background:#007a52;"></span>'+rtPresence[id].name+'</span>';
  });
  box.innerHTML=h;
}
function broadcastField(key,kind,value){
  if(!reportRef)return;
  reportRef.child(key).set({key:key, kind:kind, value:value, by:myTabId});
}
function flashSync(el){
  if(!el)return;
  el.classList.add('sync-flash');
  setTimeout(function(){ el.classList.remove('sync-flash'); },600);
}
function applyRemoteField(key,kind,value){
  if(kind==='input'){
    var el=document.querySelector('#docRoot [data-f="'+key+'"]');
    if(el&&el.tagName==='INPUT'&&document.activeElement!==el){ el.value=value; flashSync(el); }
  }else if(kind==='html'){
    var el2=document.querySelector('#docRoot [data-f="'+key+'"]');
    if(el2&&el2.tagName!=='INPUT'&&document.activeElement!==el2){ el2.innerHTML=value; flashSync(el2); }
  }else if(kind==='math'){
    var mf=mfMap[key];
    var mfEl=document.querySelector('#docRoot [data-mf="'+key+'"]');
    if(mf&&mfEl&&!(document.activeElement&&mfEl.contains(document.activeElement))){
      try{ mf.latex(value); }catch(e){}
      flashSync(mfEl);
    }
  }
}

/* =================== MATHQUILL =================== */
var MQ=MathQuill.getInterface(2),activeMF=null,mfMap={},inlineSeq=0;
function makeMF(el,ro){
  if(ro){try{return MQ.StaticMath(el);}catch(e){return null;}}
  var mf=MQ.MathField(el,{
    spaceBehavesLikeTab:true,
    autoCommands:'pi theta sqrt sum prod int alpha beta gamma delta Delta epsilon varepsilon zeta eta iota kappa lambda mu nu xi rho sigma tau upsilon phi varphi chi psi omega Gamma Theta Lambda Xi Pi Sigma Upsilon Phi Psi Omega infty partial nabla hbar ell',
    autoOperatorNames:'ln log sin cos tan cot sec csc sinh cosh tanh arcsin arccos arctan exp lim max min sup inf det dim',
    handlers:{edit:function(){
      activeMF=mf;markDirty();
      var k=el.dataset.mf;
      if(REALTIME_ON&&reportRef&&k&&k.indexOf('inline-')!==0){ broadcastField(k,'math',mf.latex()); }
    }}
  });
  el.addEventListener('focusin',function(){activeMF=mf;});
  return mf;
}
function initDoc(readonly,gradeMode){
  mfMap={};activeMF=null;
  document.querySelectorAll('#docRoot .mf').forEach(function(el){mfMap[el.dataset.mf]=makeMF(el,readonly);});
  document.querySelectorAll('#docRoot .mat-tab').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#docRoot .mat-tab').forEach(function(x){x.classList.remove('active');});
      document.querySelectorAll('#docRoot .mat-panel').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      document.querySelector('#docRoot .mat-panel[data-matp="'+b.dataset.mat+'"]').classList.add('active');
    };
  });
  if(readonly){
    document.querySelectorAll('#docRoot input').forEach(function(i){i.readOnly=true;});
    document.querySelectorAll('#docRoot [contenteditable]').forEach(function(e){
      if(gradeMode&&e.dataset.f==='info-gvnote')return;
      e.setAttribute('contenteditable','false');
    });
  }else{
    document.querySelectorAll('#docRoot input, #docRoot [contenteditable]').forEach(function(e){
      e.addEventListener('input',function(){
        markDirty();
        var k=e.dataset.f;
        if(REALTIME_ON&&reportRef&&k&&k.indexOf('inline-')!==0){
          broadcastField(k, e.tagName==='INPUT'?'input':'html', e.tagName==='INPUT'?e.value:e.innerHTML);
        }
      });
    });
  }
  dirty=false;updateSaveState();
}

/* -------- Chèn công thức inline -------- */
var savedRange=null;
document.addEventListener('selectionchange',function(){
  var sel=window.getSelection();if(sel.rangeCount===0)return;
  var r=sel.getRangeAt(0),n=r.startContainer,el=(n.nodeType===1?n:n.parentNode);
  if(el&&el.closest&&el.closest('.rich')&&el.closest('.rich').getAttribute('contenteditable')!=='false')savedRange=r.cloneRange();
});
function insertInlineFormula(){
  var r=savedRange;
  if(!r){var f=document.querySelector('#docRoot .rich[contenteditable="true"]');if(!f)return;
    f.focus();r=document.createRange();r.selectNodeContents(f);r.collapse(false);}
  inlineSeq++;
  var sp=document.createElement('span');
  sp.className='mf inline-mf';sp.setAttribute('contenteditable','false');sp.dataset.mf='inline-'+inlineSeq;
  r.deleteContents();r.insertNode(sp);
  var sep=document.createTextNode('\u00A0');sp.parentNode.insertBefore(sep,sp.nextSibling);
  var nr=document.createRange();nr.setStartAfter(sep);nr.collapse(true);
  var s=window.getSelection();s.removeAllRanges();s.addRange(nr);savedRange=nr.cloneRange();
  var mf=makeMF(sp,false);mfMap[sp.dataset.mf]=mf;mf.focus();markDirty();
}

/* -------- Lưu / nạp -------- */
var dirty=false;
function markDirty(){if(!dirty){dirty=true;updateSaveState();}}
function updateSaveState(){
  var e=document.getElementById('saveState');if(!e)return;
  e.textContent=dirty?'Có thay đổi chưa lưu':'Đã lưu';
  e.style.color=dirty?'#9c6a06':'#565f68';
}
function collectDocData(){
  var d={fields:{},math:{},html:{}};
  document.querySelectorAll('#docRoot [data-f]').forEach(function(el){
    var k=el.dataset.f;
    if(el.tagName==='INPUT')d.fields[k]=el.value;else d.html[k]=el.innerHTML;
  });
  Object.keys(mfMap).forEach(function(k){
    if(k.indexOf('inline-')===0||!mfMap[k])return;
    try{d.math[k]=mfMap[k].latex();}catch(e){}
  });
  return d;
}
function loadDocData(d){
  if(!d)return;
  Object.keys(d.fields||{}).forEach(function(k){
    var el=document.querySelector('#docRoot [data-f="'+k+'"]');if(el&&el.tagName==='INPUT')el.value=d.fields[k];});
  Object.keys(d.html||{}).forEach(function(k){
    var el=document.querySelector('#docRoot [data-f="'+k+'"]');if(el&&el.tagName!=='INPUT')el.innerHTML=d.html[k];});
  Object.keys(d.math||{}).forEach(function(k){if(mfMap[k]){try{mfMap[k].latex(d.math[k]);}catch(e){}}});
  dirty=false;updateSaveState();
}
function saveDraft(){
  var g=groupOf(S.user.groupId),r=ensureReport(g.id,g.course,S.lab);
  var data=collectDocData();
  var e=document.getElementById('saveState');
  var btn=document.querySelector('.actionbar .btn-primary');
  if(e){e.textContent='Đang lưu…';e.style.color='#9c6a06';}
  if(btn) btn.disabled=true;
  var tId=showToast('Đang lưu báo cáo…','loading');

  gasPost('saveDraft',{groupId:g.id, course:g.course, lab:S.lab, dataJSON:JSON.stringify(data), editorId:S.user.id})
    .then(function(res){
      if(btn) btn.disabled=false;
      if(!res||!res.ok){
        if(e){e.textContent='Lưu thất bại — thử lại';e.style.color='#c62828';}
        updateToast(tId,'Lưu thất bại — thử lại.','error');
        return;
      }
      r.data=data;
      if(r.status==='empty')r.status='draft';
      r.lastEditBy=S.user.id; r.lastEditAt=res.lastEditAt;
      dirty=false;
      if(e){e.textContent='Đã lưu lúc '+fmtDT(r.lastEditAt);e.style.color='#007a52';}
      updateToast(tId,'Đã lưu báo cáo.','success');
    })
    .catch(function(err){
      if(btn) btn.disabled=false;
      if(e){e.textContent='Không kết nối được máy chủ — thử lại';e.style.color='#c62828';}
      updateToast(tId,'Không kết nối được máy chủ.','error');
      console.error(err);
    });
}

/* =================== TIỆN ÍCH DÙNG CHUNG CHO MỌI MODULE =================== */
function num(v){
  if(v===undefined||v===null)return NaN;
  var s=String(v).trim().replace(',','.');
  if(s==='')return NaN;
  var n=parseFloat(s);return isNaN(n)?NaN:n;
}
function r5(x){return isFinite(x)?(Math.round(x*100000)/100000):NaN;}
function fm(x,dec){
  if(!isFinite(x))return '—';
  return x.toFixed(dec===undefined?5:dec);
}

/* Chế độ hiện tại của form đang vẽ ('edit'|'view'|'grade') — mỗi module PHẢI gọi
   LabUtils.setMode(mode) ở đầu hàm buildDoc(mode) của mình, để cpItem() biết có
   cần chèn khung "Hệ thống tính" hay không. */
var LAB_MODE='edit';
function labSetMode(m){ LAB_MODE=m||'edit'; }
function labCpGridClass(){ return 'cpgrid'+(LAB_MODE==='grade'?' grading':''); }
function labCpItem(id,label,unit){
  var s='<div class="cpitem"><label>'+label+'</label><div class="cpf mf" data-mf="'+id+'"></div>';
  s+='<input class="cpu" data-f="'+id+'-u" placeholder="đơn vị" value="'+unit+'">';
  if(LAB_MODE==='grade') s+='<span class="calcbox"><span class="tagc">Hệ thống tính</span><span data-calc="'+id+'">—</span></span>';
  s+='</div>';

}
function labWorkBlock(id,label){

}
/* Khối thông tin đầu báo cáo (Lớp/Nhóm/Giờ học/Họ tên/Nhận xét GV) — giống hệt
   nhau ở mọi bài, mọi module chỉ cần gọi LabUtils.infoTable() một lần trong

  h+='<td class="lb">Nhóm</td><td><input data-f="info-group" placeholder="VD: 01"></td>';

/* Tìm giao điểm 2 đường cùng lấy mẫu tại các điểm xs giống nhau (nội suy tuyến
   tính giữa 2 điểm gần nhất đổi dấu hiệu số ysA[i]-ysB[i]). Dùng cho các bài có
   đồ thị tìm giao điểm (VD Bài 2: T1(λ') và T2(λ')).
   Trả về {x,y} hoặc null nếu không tìm thấy đoạn nào đổi dấu (2 đường không cắt
   nhau trong khoảng dữ liệu đã cho, hoặc số liệu còn thiếu/chưa hợp lệ). */
function labFindIntersection(xs, ysA, ysB){
  for(var i=0;i<xs.length-1;i++){
    var x1=xs[i], x2=xs[i+1];
    var a1=ysA[i], a2=ysA[i+1], b1=ysB[i], b2=ysB[i+1];
    if([x1,x2,a1,a2,b1,b2].some(function(v){return !isFinite(v);})) continue;
    var d1=a1-b1, d2=a2-b2;
    if(d1===0) return {x:x1, y:a1};
    if(d1>0===d2>0) continue; // không đổi dấu trong đoạn này -> không cắt nhau ở đây
    var t=d1/(d1-d2);
    var x=x1+t*(x2-x1);
    var y=a1+t*(a2-a1);
    return {x:x, y:y};
  }
  return null;
}
/* Vẽ 1 phân số thật (tử số trên, mẫu số dưới, có gạch ngang ở giữa) thay vì viết
   liền bằng dấu "/" — dùng trong văn bản hướng dẫn/công thức (hint, instr,
   workBlock). num/den là chuỗi HTML bất kỳ (được phép chứa <span class="ol">,

   dạng "a/b" bình thường) — chỉ dùng cho phần chữ hiển thị công thức tham khảo. */
function labFrac(num, den){
  return '<span class="mfrac"><span class="mfrac-n">'+num+'</span><span class="mfrac-d">'+den+'</span></span>';
}
window.LabUtils={

/* fillCalcBoxes: hàm dùng CHUNG cho mọi bài — gọi module.compute(fields) rồi
   đổ kết quả vào các span [data-calc="key"] tương ứng đã có sẵn trong buildDoc.
   Module mới không cần đụng vào hàm này. */
function fillCalcBoxes(data,module){
  if(!data||!data.fields||!module||!module.compute)return;
  var map;
  try{ map=module.compute(data.fields); }catch(e){ return; }
  Object.keys(map).forEach(function(key){
    var el=document.querySelector('#docRoot [data-calc="'+key+'"]');
    if(el) el.textContent=map[key];
  });
}

/* =================== XUẤT PDF (LƯU TRỮ CUỐI KỲ) ===================
   Chụp lại đúng nội dung báo cáo ở chế độ 'view' (giống hệt bài sinh viên đã
   nộp — không kèm khung "Hệ thống tính" của GV) rồi xuất thành file PDF, dùng
   để lưu trữ sau mỗi học kỳ. Tự chèn thêm dòng điểm số (điểm hiện KHÔNG được
   vẽ ở đâu trong buildDoc() của từng bài, chỉ nằm riêng ở cột grade) vào
   đúng ô "Nhận xét của GV" — không đụng vào 5 file bài, chỉ xử lý ở đây.

   Vì mọi module bài đọc/ghi DOM qua selector cứng "#docRoot", nếu đang có
   sẵn 1 báo cáo hiển thị trên màn hình (cũng mang id "docRoot") thì phải tạm
   đổi id của nó đi trong lúc dựng bản ẩn để xuất PDF, xong rồi trả lại y
   nguyên — tránh việc 2 phần tử cùng id gây lẫn dữ liệu giữa 2 báo cáo. */

function pdfSafeName(s){ return String(s||'').replace(/[\\\/:*?"<>|]+/g,'-').trim() || 'BaoCao'; }
function pdfFileName(course,groupName,lab){ return pdfSafeName(course)+'_'+pdfSafeName(groupName)+'_Bai'+lab+'.pdf'; }

/* Tự chụp (html2canvas) rồi tự ghép vào PDF bằng jsPDF — KHÔNG dùng thư viện
   html2pdf.js nữa. Lý do: đã kiểm chứng thực tế html2pdf.js tính sai tỉ lệ
   ảnh trong một số trường hợp (nội dung bị thu nhỏ dồn vào góc trái, các
   trang sau chỉ còn 1 dải hẹp, phần còn lại trắng) — lỗi nằm ở chính cơ chế
   phân trang/co giãn tự động bên trong html2pdf.js, không phải ở html2canvas
   (html2canvas dùng riêng luôn cho kết quả đúng trong mọi trường hợp đã thử,
   kể cả màn hình Retina). Tự làm 3 bước: chụp canvas đúng kích thước host ->
   cắt thành từng "lát" cao bằng 1 trang giấy -> addImage từng lát vào PDF,
   sang trang mới nếu còn dư — tự kiểm soát chính xác từng con số. */
var PDF_PAGE_W_MM=297, PDF_PAGE_H_MM=210, PDF_MARGIN_MM=8; // A4 ngang
var PDF_SCALE=2;

/* Sửa lệch dòng chữ số/đơn vị bên trong <input> khi html2canvas chụp — html2canvas
   không canh giữa dọc (vertical-align) nội dung input giống trình duyệt thật.
   Ép line-height = đúng offsetHeight hiện tại của từng ô để buộc canh giữa đúng.
   KHÔNG đổi tag input thành div/span vì nhiều rule CSS nhắm theo tag (table.data
   input{...}, .instr input{...}, .cpu...) chứ không phải theo class. */
function pdfFixInputAlignment(host){
  host.querySelectorAll('input').forEach(function(el){
    var h=el.offsetHeight;
    if(h>0) el.style.lineHeight=h+'px';
  });
}

/* Các phần tử "không được cắt ngang" giữa 2 trang PDF: hàng bảng, khung chốt kết
   quả, khung điểm số GV... Cắt ngang giữa các phần tử này khiến 1 hàng/khung bị
   chặt làm đôi giữa cuối trang N và đầu trang N+1. */
var PDF_NOBREAK_SELECTORS=['tr','.cpitem','.resline','.cpbox','.resbox','.gv-cell','.mean','.rt-bar','.mfrac'];

/* Đo toạ độ top/bottom (đơn vị px canvas, đã nhân scale) của mọi phần tử không
   được cắt ngang — PHẢI đo bằng getBoundingClientRect() lúc DOM còn ở trạng thái
   bình thường (trước khi html2canvas chụp), vì sau khi chụp thành ảnh thì không
   còn biết ranh giới hàng/khung nằm ở đâu nữa. Đo SAU khi pdfFixInputAlignment đã
   chạy, để toạ độ khớp đúng layout cuối cùng sẽ được chụp. */
function pdfComputeSafeBreaks(host,scale){
  var hostRect=host.getBoundingClientRect();
  var spans=[];
  PDF_NOBREAK_SELECTORS.forEach(function(sel){
    host.querySelectorAll(sel).forEach(function(el){
      var r=el.getBoundingClientRect();
      var top=(r.top-hostRect.top)*scale, bottom=(r.bottom-hostRect.top)*scale;
      if(bottom>top) spans.push({top:top,bottom:bottom});
    });
  });
  spans.sort(function(a,b){ return a.top-b.top; });
  return spans;
}

/* Nếu điểm cắt mong muốn (desiredEnd, theo chiều cao trang cố định) rơi vào giữa
   1 span không được cắt, đẩy điểm cắt lên ngay trước phần tử đó (trang hiện tại
   co lại một chút, phần tử dồn hết sang trang sau). Lặp để xử lý phần tử lồng
   nhau (tr trong bảng trong section, .cpitem trong .cpbox…). minEnd là giới hạn
   dưới (vd 40% chiều cao 1 trang) — nếu 1 khối cao hơn cả 1 trang, đẩy lên nữa sẽ
   tạo trang gần như rỗng, nên đành chấp nhận cắt ngang tại điểm ban đầu. */
function pdfAdjustSliceEnd(desiredEnd,spans,minEnd){
  var end=desiredEnd;
  for(var iter=0;iter<8;iter++){
    var hit=null;
    for(var i=0;i<spans.length;i++){
      var sp=spans[i];
      if(sp.top<end-0.5 && sp.bottom>end+0.5){ hit=sp; break; }
    }
    if(!hit) return end;
    if(hit.top<=minEnd) return desiredEnd; // khối quá cao — chấp nhận cắt ngang, tránh trang gần rỗng
    end=hit.top;
  }
  return end;
}

function pdfCaptureAndBuild(host){
  pdfFixInputAlignment(host);
  var spans=pdfComputeSafeBreaks(host,PDF_SCALE);
  return html2canvas(host,{scale:PDF_SCALE, useCORS:true, backgroundColor:'#ffffff', windowWidth:1040, scrollX:0, scrollY:0}).then(function(canvas){
    var contentWmm=PDF_PAGE_W_MM-PDF_MARGIN_MM*2;
    var contentHmm=PDF_PAGE_H_MM-PDF_MARGIN_MM*2;
    var pxPerMm=canvas.width/contentWmm;
    var sliceHeightPx=Math.max(1,Math.floor(contentHmm*pxPerMm));
    var minSliceHpx=Math.floor(sliceHeightPx*0.4); // giới hạn dưới: 40% 1 trang chuẩn

    var JsPdfCtor=(window.jspdf&&window.jspdf.jsPDF)?window.jspdf.jsPDF:window.jsPDF;
    var doc=new JsPdfCtor({unit:'mm', format:'a4', orientation:'landscape'});

    var y=0, first=true;
    while(y<canvas.height){
      var desiredEnd=Math.min(y+sliceHeightPx, canvas.height);
      var sliceEnd=desiredEnd;
      if(desiredEnd<canvas.height){
        sliceEnd=pdfAdjustSliceEnd(desiredEnd, spans, y+minSliceHpx);
      }
      var sliceH=Math.min(canvas.height-y, Math.max(1,Math.round(sliceEnd-y)));
      var sliceCanvas=document.createElement('canvas');
      sliceCanvas.width=canvas.width; sliceCanvas.height=sliceH;
      sliceCanvas.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
      var imgData=sliceCanvas.toDataURL('image/jpeg',0.95);
      if(!first) doc.addPage();
      doc.addImage(imgData,'JPEG',PDF_MARGIN_MM,PDF_MARGIN_MM,contentWmm,sliceH/pxPerMm);
      first=false;
      y+=sliceH;
    }
    return doc;
  });
}
/* Đợi biểu đồ Chart.js (nếu bài có) vẽ xong khung hình rồi mới chụp — Chart.js
   vẽ không hoàn toàn đồng bộ ngay trong cùng 1 tick. */
function pdfWaitChartsPaint(){ return new Promise(function(res){ setTimeout(res,450); }); }

function pdfInjectGradeLine(host,grade){
  var cell=host.querySelector('.gv-cell');
  if(!cell) return;
  var div=document.createElement('div');
  div.style.cssText='font-family:var(--ui);font-size:11.5px;font-weight:700;color:#0576b8;margin-bottom:6px;';
  div.textContent='Điểm: '+((grade!=null&&grade!=='')?(grade+'/20'):'Chưa chấm');
  cell.insertBefore(div,cell.firstChild);
}

/* Dựng 1 bản báo cáo ẩn (chế độ 'view') ngoài màn hình, sẵn sàng để chụp PDF.
   Trả về {host, restore} — host là phần tử chứa nội dung, restore() phải được
   gọi sau khi chụp xong (hoặc khi lỗi) để dọn dẹp và trả lại id "docRoot" cũ. */
function pdfBuildOffscreenDoc(course,lab,data,grade){
  var mod=getLabModule(course,lab);
  if(!mod) return null;
  var prevLive=document.getElementById('docRoot');
  if(prevLive) prevLive.id='docRoot__live';
  var host=document.createElement('div');
  host.id='docRoot';
  host.className='pdf-host';
  /* Định vị off-screen (position:absolute, toạ độ âm) — đã kiểm chứng thực
     tế là AN TOÀN với html2canvas gọi trực tiếp (không qua html2pdf.js nữa),
     nên không còn cần "lộ" tạm ở cuối trang như trước; host không hiện ra
     trên màn hình trong lúc xuất PDF. */
  host.style.cssText='position:absolute;left:-10000px;top:0;width:1040px;background:#fff;';
  document.body.appendChild(host);
  host.innerHTML=mod.buildDoc('view');
  initDoc(true,false);
  if(data) loadDocData(data);
  if(mod.afterRender){ try{ mod.afterRender('view'); }catch(e){ console.error('afterRender lỗi khi xuất PDF:',e); } }
  pdfInjectGradeLine(host,grade);
  return {
    host:host,
    restore:function(){
      if(host.parentNode) document.body.removeChild(host);
      if(prevLive) prevLive.id='docRoot';
    }
  };
}

/* Xuất PDF cho đúng 1 báo cáo — dùng cho cả nút "Tải PDF" bên sinh viên lẫn
   bên GV (màn hình chấm bài). Luôn dựng bản 'view' riêng, không phụ thuộc
   báo cáo đang hiển thị trên màn hình đang ở chế độ nào. */
function exportReportPdf(gid,course,lab){
  var mod=getLabModule(course,lab);
  if(!mod){ alert('Bài này chưa có mẫu báo cáo (module).'); return; }
  var g=groupOf(gid);
  var tId=showToast('Đang tạo file PDF…','loading');
  ensureReportData(gid,course,lab).then(function(data){
    var r=reportOf(gid,course,lab);
    var built=pdfBuildOffscreenDoc(course,lab,data,r?r.grade:null);
    if(!built){ updateToast(tId,'Không dựng được nội dung báo cáo.','error'); return; }
    return pdfWaitChartsPaint().then(function(){
      var filename=pdfFileName(course, g?g.name:gid, lab);
      return pdfCaptureAndBuild(built.host).then(function(doc){ doc.save(filename); });
    }).then(function(){
      built.restore();
      updateToast(tId,'Đã tạo file PDF.','success');
    }).catch(function(err){
      built.restore();
      throw err;
    });
  }).catch(function(err){
    updateToast(tId,'Xuất PDF thất bại — kiểm tra mạng và thử lại.','error');
    console.error(err);
  });
}

/* Xuất hàng loạt — dùng ở màn hình "Quản lý bài nộp": lấy đúng danh sách báo
   cáo đang lọc theo môn/lớp trên màn hình đó (chỉ báo cáo đã nộp/đã chấm),
   dựng lần lượt (không làm song song, tránh đụng id "docRoot"), gộp tất cả
   thành 1 file .zip rồi tải về — mỗi bài 1 file PDF riêng bên trong. */
function exportSubmissionsPdfZip(rows){
  if(!rows||rows.length===0){ alert('Không có báo cáo đã nộp nào khớp bộ lọc để xuất PDF.'); return; }
  var btn=document.getElementById('btnExportPdfZip');
  if(btn) btn.disabled=true;
  var tId=showToast('Đang tạo PDF: 0/'+rows.length+'…','loading');
  var zip=new JSZip();
  var i=0;
  function finish(){
    updateToast(tId,'Đang nén file zip…','loading');
    zip.generateAsync({type:'blob'}).then(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      var p=function(n){return n<10?'0'+n:''+n;}; var d=new Date();
      a.href=url; a.download='BaoCao_PDF_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.zip';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      if(btn) btn.disabled=false;
      updateToast(tId,'Đã xuất '+rows.length+' file PDF (gộp trong 1 file zip).','success');
    }).catch(function(err){
      if(btn) btn.disabled=false;
      updateToast(tId,'Nén file zip thất bại.','error');
      console.error(err);
    });
  }
  function next(){
    if(i>=rows.length){ finish(); return; }
    var r=rows[i];
    ensureReportData(r.groupId,r.course,r.lab).then(function(data){
      var built=pdfBuildOffscreenDoc(r.course,r.lab,data,r.grade);
      if(!built){ i++; next(); return; }
      return pdfWaitChartsPaint().then(function(){
        return pdfCaptureAndBuild(built.host);
      }).then(function(doc){
        built.restore();
        var blob=doc.output('blob');
        var g=groupOf(r.groupId);
        zip.file(pdfFileName(r.course, g?g.name:r.groupId, r.lab), blob);
        i++;
        updateToast(tId,'Đang tạo PDF: '+i+'/'+rows.length+'…','loading');
        next();
      }).catch(function(err){
        built.restore();
        console.error('Lỗi xuất PDF cho nhóm '+r.groupId+' bài '+r.lab+':',err);
        i++; next(); // bỏ qua báo cáo lỗi, tiếp tục các báo cáo còn lại
      });
    }).catch(function(err){
      console.error('Không tải được dữ liệu báo cáo:',err);
      i++; next();
    });
  }
  next();
}
/* Nút "Xuất PDF" ở màn hình Quản lý bài nộp — lấy đúng bộ lọc môn/lớp đang
   chọn trên màn hình đó (S.subCourse / S.subClass), chỉ xuất báo cáo đã nộp
   hoặc đã chấm (báo cáo còn "Chưa làm"/"Đang lưu tạm" thì bỏ qua). */
function renderSubmissionsExportPdf(){
  var rows=DB.reports.filter(function(r){
    if(r.status!=='submitted'&&r.status!=='graded') return false;
    if(S.subCourse && r.course!==S.subCourse) return false;
    if(S.subClass){ var g=groupOf(r.groupId); if(!g||g.classId!==S.subClass) return false; }
    return !!getLabModule(r.course,r.lab);
  }).sort(function(a,b){return (a.groupId+a.lab).localeCompare(b.groupId+b.lab);});
  exportSubmissionsPdfZip(rows);
}

    h+='<button class="admin-tab'+(S.subCourse===c.code?' active':'')+'" onclick="switchSubCourse(\''+c.code+'\')">'+c.code+'</button>';
  });

    h+='<select onchange="switchSubClass(this.value)" style="padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;">';
    h+='<option value="">Tất cả lớp ('+S.subCourse+')</option>';

    }

  /* ---- Lọc danh sách báo cáo theo 2 tầng trên ---- */
  var rows=DB.reports.filter(function(r){
    if(S.subCourse && r.course!==S.subCourse) return false;

      var g=groupOf(r.groupId);
      if(!g || g.classId!==S.subClass) return false;
    }

  }).sort(function(a,b){return (a.groupId+a.lab).localeCompare(b.groupId+b.lab);});

  var filterNote = S.subCourse ? (S.subCourse+(S.subClass&&classOf(S.subClass)?' · '+classOf(S.subClass).name:' · tất cả lớp')) : 'tất cả môn';

  h+='<button id="btnExportPdfZip" class="btn-ghost btn-sm" onclick="renderSubmissionsExportPdf()">Xuất PDF (theo bộ lọc, .zip)</button></div>';
  h+='<p class="hint" style="text-align:right;margin-top:-6px;">Chỉ gồm báo cáo đã nộp/đã chấm, đúng như sinh viên đã nộp (không kèm khung đối chiếu của GV).</p>';

  h+='<div class="panel-body flush"><table class="list"><thead><tr>'
   +'<th>Môn</th><th>Bài</th><th>Nhóm</th><th>Tình trạng</th><th>Tên trong BC</th><th>Sửa lần cuối</th><th>Thời gian nộp</th><th>Điểm</th>'
   +'</tr></thead><tbody>';
  if(rows.length===0)h+='<tr><td colspan="8" class="muted tiny" style="text-align:center;padding:20px;">Không có báo cáo nào khớp bộ lọc.</td></tr>';
  var stripe=0, prevGroup=null;
  rows.forEach(function(r){
    if(r.groupId!==prevGroup){ stripe=1-stripe; prevGroup=r.groupId; }
    var rowBg=stripe? ' style="background:var(--surface);"' : '';

    h+='<td><span class="status '+r.status+'">'+statusLabel(r.status)+'</span></td>';
    h+='<td class="tiny">'+(mc.listed.length===0?'<span class="muted">— (xem chi tiết)</span>'

    h+='<td class="tiny muted">'+fmtDT(r.lastEditAt)+'<br>'+(r.lastEditBy?userName(r.lastEditBy):'—')+'</td>';
    h+='<td class="tiny muted">'+fmtDT(r.submittedAt)+'</td>';

    var h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">';
    h+='<div class="modal-head"><h3>'+course+' — Bài '+lab+' — '+g.name+'</h3><button onclick="closeModal()">×</button></div><div class="modal-body">';
    h+='<div class="kv"><span class="k">Tình trạng</span><span><span class="status '+r.status+'">'+statusLabel(r.status)+'</span></span></div>';

    h+='<div class="kv"><span class="k">Thời gian nộp (giờ máy chủ)</span><span>'+fmtDT(r.submittedAt)+'</span></div>';
    h+='<div class="kv"><span class="k">Điểm</span><span>'+(r.grade!=null?'<b>'+r.grade+'</b>/20':'Chưa chấm')+'</span></div>';
    h+='<div style="margin-top:16px;"><div style="font-size:12px;color:#565f68;margin-bottom:7px;">Thành viên nhóm và tình trạng ghi tên trong báo cáo</div>';
    h+='<table class="list" style="border:1px solid #e6ebef;"><thead><tr><th style="width:110px;">MSSV</th><th>Họ tên</th><th style="width:140px;">Có tên trong BC</th></tr></thead><tbody>';

      h+='<td>'+(ok?'<span class="status graded">Có — tính điểm</span>':'<span class="status" style="background:#fdecec;color:#c62828;border-color:#f0b3ae;">Không — 0 điểm</span>')+'</td></tr>';

function unlockReport(gid,course,lab){
  var tId=showToast('Đang mở khóa báo cáo…','loading');
  gasPost('unlockReport',{groupId:gid,course:course,lab:lab}).then(function(res){
    if(!res||!res.ok){
      updateToast(tId,'Không mở khóa được — kiểm tra đã thêm action "unlockReport" vào Apps Script chưa.','error');
      return;
    }
    var r=reportOf(gid,course,lab); if(r){ r.status='draft'; r.submittedAt=null; }
    updateToast(tId,'Đã mở khóa báo cáo.','success');
    closeModal(); goAdmin('submissions');
  }).catch(function(err){
    updateToast(tId,'Không kết nối được máy chủ.','error');
    console.error(err);
  });
}

function renderGrading(){
  if(!S.gradeStatusFilter) S.gradeStatusFilter='submitted';

  DB.courses.forEach(function(c){
    h+='<button class="admin-tab'+(S.subCourse===c.code?' active':'')+'" onclick="switchGradeCourse(\''+c.code+'\')">'+c.code+'</button>';
  });
  h+='</div>';

  var classOptions=[];

  if(S.subCourse){
    classOptions=DB.classes.filter(function(c){return c.course===S.subCourse;});
    h+='<select onchange="switchGradeClass(this.value)" style="padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;">';
    h+='<option value="">Tất cả lớp ('+S.subCourse+')</option>';
    classOptions.forEach(function(c){ h+='<option value="'+c.id+'"'+(S.subClass===c.id?' selected':'')+'>'+c.name+'</option>'; });
    h+='</select>';
  }
  h+='<select onchange="switchGradeStatus(this.value)" style="padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;">';
  h+='<option value="submitted"'+(S.gradeStatusFilter==='submitted'?' selected':'')+'>Chưa chấm</option>';
  h+='<option value="graded"'+(S.gradeStatusFilter==='graded'?' selected':'')+'>Đã chấm</option>';
  h+='<option value="all"'+(S.gradeStatusFilter==='all'?' selected':'')+'>Tất cả</option>';
  h+='</select>';

  h+='<button class="btn-ghost btn-sm" onclick="exportGradesExcel()">Xuất bảng điểm (Excel)</button>';
  h+='</div>';
  if(S.subCourse && classOptions.length===0){
    h+='<div class="alert warn">Môn '+S.subCourse+' chưa có lớp nào. Tạo lớp ở tab "Quản lý nhóm" trước.</div>';
  }

  var subs=DB.reports.filter(function(r){
    if(r.status!=='submitted'&&r.status!=='graded') return false;
    if(S.gradeStatusFilter!=='all' && r.status!==S.gradeStatusFilter) return false;
    if(S.subCourse && r.course!==S.subCourse) return false;
    if(S.subClass){ var g=groupOf(r.groupId); if(!g||g.classId!==S.subClass) return false; }
    return true;
  }).sort(function(a,b){return (a.groupId+a.lab).localeCompare(b.groupId+b.lab);});

  h+='<div class="panel"><div class="panel-head"><h3>Báo cáo</h3><span class="note">'+subs.length+' báo cáo khớp bộ lọc</span></div>';
  h+='<div class="panel-body flush"><table class="list"><thead><tr><th>Môn</th><th>Bài</th><th>Nhóm</th><th>Nộp lúc</th><th>Điểm /20</th><th style="width:130px;"></th></tr></thead><tbody>';

    h+='<td><button class="btn-ghost btn-sm" onclick="openGradeView(\''+r.groupId+'\',\''+r.course+'\','+r.lab+')">Mở chấm</button></td></tr>';
  });
  h+='</tbody></table></div></div>';

  /* Bảng tổng điểm theo nhóm — lọc theo đúng môn/lớp đang chọn ở trên */
  var groupsForTotal=DB.groups.filter(function(g){
    if(S.subCourse && g.course!==S.subCourse) return false;
    if(S.subClass && g.classId!==S.subClass) return false;
    return true;
  }).slice().sort(function(a,b){return a.name.localeCompare(b.name,'vi',{numeric:true});});

  h+='<th style="width:90px;">Tổng /100</th></tr></thead><tbody>';

  groupsForTotal.forEach(function(g){
    var tot=0,any=false;
    h+='<tr><td><b>'+g.name+'</b></td><td class="tiny muted">'+g.course+'</td>';
    for(var i=1;i<=5;i++){
      var r=reportOf(g.id,g.course,i);
      var v=(r&&r.grade!=null)?parseFloat(r.grade):null;
      if(v!=null){tot+=v;any=true;}
      h+='<td class="tiny">'+(v!=null?v:'<span class="muted">—</span>')+'</td>';
    }
    h+='<td>'+(any?'<b>'+tot+'</b>':'<span class="muted tiny">—</span>')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('adminBody').innerHTML=h;
}

/* ---- Xuất bảng điểm ra Excel (để nhập lên hệ thống của trường) ----
   Điểm mỗi sinh viên = điểm nhóm của bài đó, NHƯNG chỉ tính nếu tên sinh viên
   có trong báo cáo (đúng quy ước: không ghi tên = không có điểm bài đó). */
function exportGradesExcel(){
  var tId=showToast('Đang tổng hợp điểm để xuất file…','loading');
  var graded=DB.reports.filter(function(r){return r.status==='graded';});
  Promise.all(graded.map(function(r){ return ensureReportData(r.groupId,r.course,r.lab); }))
    .then(function(){
      var students=DB.users.filter(function(u){return u.role==='student';})
        .slice().sort(function(a,b){return a.id.localeCompare(b.id);});

      var header=['Tài khoản','Họ tên','Lớp','Nhóm','Bài 1','Bài 2','Bài 3','Bài 4','Bài 5','Tổng /100'];
      var rows=[header];

      students.forEach(function(u){
        var g=groupOf(u.groupId);
        var cls=g?classOf(g.classId):null;
        var scores=[1,2,3,4,5].map(function(labNo){
          if(!g) return '';
          var r=reportOf(g.id,g.course,labNo);
          if(!r||r.grade==null||r.grade==='') return '';
          var mc=checkMembers(r);
          var credited=mc.credited.some(function(x){return x.id===u.id;});
          return credited?Number(r.grade):0;
        });
        var hasAnyGrade=scores.some(function(s){return typeof s==='number';});
        var total=hasAnyGrade?scores.reduce(function(a,b){return a+(typeof b==='number'?b:0);},0):'';
        rows.push([u.id,u.name,cls?cls.name:'',g?g.name:''].concat(scores).concat([total]));
      });

      var ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:16},{wch:26},{wch:16},{wch:12},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:10}];
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'Bảng điểm');

      var p=function(n){return n<10?'0'+n:''+n;};
      var d=new Date();
      var filename='BangDiem_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.xlsx';
      XLSX.writeFile(wb,filename);
      updateToast(tId,'Đã xuất file '+filename,'success');
    })
    .catch(function(err){
      updateToast(tId,'Xuất file thất bại — kiểm tra mạng và thử lại.','error');
      console.error(err);
    });
}
