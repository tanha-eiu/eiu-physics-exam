function saveGradeInline(){
  var c=S.gradeCtx;if(!c)return;
  var r=reportOf(c.gid,c.course,c.lab);
  var sc=document.getElementById('gScore').value.trim();
  var nv=parseFloat(sc);
  if(sc!==''&&(isNaN(nv)||nv<0||nv>20)){alert('Điểm phải nằm trong khoảng 0 – 20.');return;}
  var note=document.getElementById('gNote').value;
  if(!r.data)r.data={fields:{},math:{},html:{}};
  if(!r.data.html)r.data.html={};
  r.data.html['info-gvnote']=note.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');

  var grade = sc===''?'':nv;
  var st=document.getElementById('gSaveState');
  var btn=document.querySelector('.gradebar .btn-primary');
  if(st) st.textContent='Đang lưu…';
  if(btn) btn.disabled=true;
  var tId=showToast('Đang lưu điểm…','loading');

  gasPost('saveGrade',{groupId:c.gid, course:c.course, lab:c.lab, grade:grade, dataJSON:JSON.stringify(r.data)})
    .then(function(res){
      if(btn) btn.disabled=false;
      if(!res||!res.ok){ if(st) st.textContent='Lưu thất bại — thử lại'; updateToast(tId,'Lưu điểm thất bại — thử lại.','error'); return; }
      r.grade = sc===''?null:nv;
      if(sc!=='') r.status='graded';
      updateToast(tId,'Đã lưu điểm.','success');
      goAdmin('grading');
    })
    .catch(function(err){
      if(btn) btn.disabled=false;
      if(st) st.textContent='Không kết nối được máy chủ';
      updateToast(tId,'Không kết nối được máy chủ.','error');
      console.error(err);
    });
}

/* -------- Import danh sách sinh viên theo Lớp --------
   Đọc đúng cấu trúc file điểm danh của phòng đào tạo:
   khối metadata đầu trang (Mã học phần, Nhóm tổ...) rồi tới bảng
   Stt | Mã SV | Họ lót | Tên | Mã lớp | Tên lớp | Ngày sinh | Điện thoại | Email
   Tự nhận diện dòng tiêu đề bảng + tự gợi ý tên Lớp dạng "PHYS 102 (V1-03)". */
function normHeader(s){ return String(s||'').trim().toLowerCase(); }

function parseSchoolExcelRows(rows){
  var hdrIdx=-1;
  for(var i=0;i<Math.min(rows.length,30);i++){
    var row=rows[i]||[];
    for(var j=0;j<row.length;j++){
      var v=normHeader(row[j]);
      if(v==='mã sv'||v==='mssv'){ hdrIdx=i; break; }
    }
    if(hdrIdx>=0) break;
  }
  var meta={course:'',group:''};
  var scanLimit = hdrIdx>=0?hdrIdx:Math.min(rows.length,30);
  for(var i=0;i<scanLimit;i++){
    var row=rows[i]||[];
    for(var j=0;j<row.length;j++){
      var v=normHeader(row[j]);
      if(v==='mã học phần'){
        for(var k=j+1;k<row.length;k++){ if(String(row[k]||'').trim()!==''){ meta.course=String(row[k]).trim(); break; } }
      }
      if(v==='nhóm tổ'){
        for(var k=j+1;k<row.length;k++){ if(String(row[k]||'').trim()!==''){ meta.group=String(row[k]).trim(); break; } }
      }
    }
  }

  var roster=[];
  if(hdrIdx>=0){
    var header=(rows[hdrIdx]||[]).map(normHeader);
    var idxMssv=header.findIndex(function(h){return h==='mã sv'||h==='mssv';});
    var idxHoTen=header.findIndex(function(h){return h==='họ tên'||h==='ho ten';});
    var idxHoLot=header.findIndex(function(h){return h==='họ lót'||h==='họ lot'||h==='họ và tên lót';});
    var idxTen=header.findIndex(function(h){return h==='tên'||h==='ten';});
    var idxEmail=header.findIndex(function(h){return h==='email';});
    for(var i=hdrIdx+1;i<rows.length;i++){
      var row=rows[i]||[];
      var mssv=idxMssv>=0?String(row[idxMssv]||'').trim():'';
      if(!mssv) continue;
      var name='';
      if(idxHoTen>=0) name=String(row[idxHoTen]||'').trim();
      else name=(String(idxHoLot>=0?row[idxHoLot]:''||'').trim()+' '+String(idxTen>=0?row[idxTen]:''||'').trim()).trim();
      var email=idxEmail>=0?String(row[idxEmail]||'').trim():'';
      roster.push({name:name,email:email,mssv:mssv});
    }
  }else{
    var start=0;
    var first=(rows[0]||[]).map(normHeader).join(' ');
    if(first.indexOf('họ tên')>=0||first.indexOf('email')>=0||first.indexOf('mssv')>=0) start=1;
    for(var i=start;i<rows.length;i++){
      var cells=(rows[i]||[]).map(function(c){return String(c||'').trim();}).filter(function(c){return c!=='';});
      if(cells.length===0) continue;
      var name='',email='',mssv='';
      if(cells.length>=3){ name=cells[0]; email=cells[1]; mssv=cells[2]; }
      else if(cells.length===2){ name=cells[0]; mssv=cells[1]; }
      else { name=cells[0]; }
      roster.push({name:name,email:email,mssv:mssv});
    }
  }

  var suggestedName=(meta.course&&meta.group)?(meta.course+' ('+meta.group+')'):meta.course;
  return {courseRaw:meta.course, groupRaw:meta.group, suggestedName:suggestedName,
    normCourse:meta.course.replace(/\s+/g,'').toUpperCase(), roster:roster};
}

var IMPORT_ROWS=[];
function computeImportRows(roster){
  var seen={};
  return roster.map(function(row){
    var uid=genUsername(row.email,row.mssv);
    var status='ok', reason='';
    if(!row.name||!row.mssv){ status='invalid'; reason='Thiếu họ tên hoặc MSSV'; }
    else if(!uid){ status='invalid'; reason='Không xác định được tài khoản'; }
    else if(DB.users.some(function(u){return u.id===uid;}) || seen[uid]){ status='duplicate'; reason='Tài khoản đã tồn tại'; }
    if(uid) seen[uid]=true;
    row.uid=uid; row.status=status; row.reason=reason;
    return row;
  });
}

  h+='</select></div></div>';
  h+='<div class="field"><label>Thời gian học <span class="muted">(có thể để trống, điền sau)</span></label><input id="impClassSchedule" placeholder="Để trống nếu chưa xếp lịch"></div>';
  h+='</div>';

  h+='<div id="impExistingClassFields" class="hidden"><div class="field"><label>Chọn lớp có sẵn</label><select id="impExistingClass">';
  DB.classes.forEach(function(c){h+='<option value="'+c.id+'"'+(c.id===S.classTab?' selected':'')+'>'+c.name+' — '+c.course+'</option>';});
  h+='</select></div></div>';

  h+='<div style="margin:16px 0 8px;font-size:12.5px;font-weight:700;">Danh sách sinh viên</div>';
  h+='<div class="field"><label>Tải file Excel/CSV xuất từ phòng đào tạo — tự nhận diện cột Mã SV / Họ tên / Email, và tự gợi ý tên lớp nếu file có sẵn "Mã học phần" / "Nhóm tổ"</label>';
  h+='<input type="file" id="impFile" accept=".xlsx,.xls,.csv" onchange="handleSchoolExcelFile(event)" style="width:100%;padding:7px;border:1px solid #c7d0d8;background:#fff;font-size:12.5px;"></div>';
  h+='<div style="text-align:center;font-size:11.5px;color:#565f68;margin:10px 0;">— hoặc dán trực tiếp bên dưới —</div>';
  h+='<div class="field"><label>Dán danh sách — mỗi dòng: Họ tên, Email, MSSV (cách nhau bằng dấu phẩy hoặc Tab)</label>';
  h+='<textarea id="impText" style="width:100%;min-height:80px;padding:9px 10px;border:1px solid #c7d0d8;font-size:12.5px;font-family:ui-monospace,monospace;" placeholder="Họ tên, Email, MSSV&#10;Nguyễn Văn A, a.nguyen@eiu.edu.vn, 2211010"></textarea></div>';
  h+='<div style="text-align:right;"><button class="btn-ghost btn-sm" onclick="doImportPreviewFromText()">Xem trước danh sách dán tay</button></div>';

  h+='<div id="impPreviewWrap"></div>';
  h+='</div><div class="modal-foot" id="impFoot">';
  h+='<button class="btn-ghost" onclick="closeModal()">Hủy</button>';
  h+='</div></div></div>';
  document.getElementById('modalHost').innerHTML=h;
}
function toggleImportClassMode(){
  var mode=document.getElementById('impClassMode').value;
  document.getElementById('impNewClassFields').classList.toggle('hidden',mode!=='new');
  document.getElementById('impExistingClassFields').classList.toggle('hidden',mode!=='existing');
}
function handleSchoolExcelFile(evt){
  var file=evt.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var parsed=parseSchoolExcelRows(rows);

      if(parsed.suggestedName) document.getElementById('impClassName').value=parsed.suggestedName;
      if(parsed.normCourse){
        var sel=document.getElementById('impClassCourse');
        for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===parsed.normCourse){ sel.selectedIndex=i; break; } }
      }
      if(parsed.roster.length===0){ alert('Không tìm thấy dòng dữ liệu sinh viên nào trong file. Kiểm tra lại định dạng.'); return; }

      IMPORT_ROWS=computeImportRows(parsed.roster);
      renderImportPreviewTable();
    }catch(err){
      alert('Không đọc được file. Kiểm tra lại định dạng .xlsx/.xls/.csv.');
    }
  };
  reader.readAsArrayBuffer(file);
}
function parseImportLine(line){
  var parts = line.indexOf('\t')>=0 ? line.split('\t') : line.split(',');
  parts = parts.map(function(p){return p.trim();});
  var name='',email='',mssv='';
  if(parts.length>=3){ name=parts[0]; email=parts[1]; mssv=parts[2]; }
  else if(parts.length===2){ name=parts[0]; mssv=parts[1]; }
  else if(parts.length===1){ name=parts[0]; }
  return {name:name,email:email,mssv:mssv};
}
function doImportPreviewFromText(){
  var raw=document.getElementById('impText').value;
  var lines=raw.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
  var header0=lines[0]?lines[0].toLowerCase():'';
  if(header0.indexOf('họ tên')>=0||header0.indexOf('email')>=0||header0.indexOf('mssv')>=0) lines.shift();
  var roster=lines.map(parseImportLine);
  if(roster.length===0){ alert('Chưa có dòng nào để xem trước.'); return; }
  IMPORT_ROWS=computeImportRows(roster);
  renderImportPreviewTable();
}
function doImportConfirm(){
  var mode=document.getElementById('impClassMode').value;
  var payload={rows: IMPORT_ROWS.filter(function(r){return r.status==='ok';})
    .map(function(r){return {uid:r.uid, mssv:r.mssv, name:r.name, email:r.email||''};})};

  if(mode==='existing'){
    var classId=document.getElementById('impExistingClass').value;
    if(!classId){alert('Chọn 1 lớp có sẵn.');return;}
    payload.classId=classId;
  }else{
    var name=document.getElementById('impClassName').value.trim();
    if(!name){alert('Nhập tên lớp, hoặc chuyển sang "Thêm vào lớp đã có".');return;}
    payload.newClass={
      name:name,
      course:document.getElementById('impClassCourse').value,
      schedule:document.getElementById('impClassSchedule').value.trim()||'—'
    };
  }

  var btn=document.querySelector('#impFoot .btn-primary'); if(btn){btn.disabled=true;btn.textContent='Đang tạo…';}
  var tId=showToast('Đang import danh sách sinh viên…','loading');
  gasPost('importStudents',payload).then(function(res){
    if(!res||!res.ok){ updateToast(tId,'Import thất bại — thử lại.','error'); if(btn){btn.disabled=false;} return; }
    IMPORT_ROWS=[];
    S.classTab=res.classId;
    updateToast(tId,'Đã import '+(res.created!=null?res.created:'')+' tài khoản.','success');
    closeModal();
    refreshAndRender(function(){ goAdmin('groups'); });
  }).catch(function(err){
    updateToast(tId,'Không kết nối được máy chủ.','error'); console.error(err);
    if(btn){btn.disabled=false;}
  });
}


/* ---- Template ---- */
function renderTemplates(){
  var h='<div class="alert info">Mỗi bài thí nghiệm có cấu trúc số liệu và công thức riêng, được cấu hình thành 1 mẫu báo cáo (module) độc lập. Bài chưa có mẫu sẽ không hiển thị cho sinh viên chọn làm.</div>';
  DB.courses.forEach(function(c){
    var labs=labsForCourse(c.code);
    h+='<div class="panel"><div class="panel-head"><h3>'+c.code+' — '+c.name+'</h3></div>';
    h+='<div class="panel-body flush"><table class="list"><thead><tr><th style="width:50px;">Bài</th><th>Tên bài</th><th style="width:150px;">Template</th><th style="width:120px;"></th></tr></thead><tbody>';
    labs.forEach(function(l){
      var has=!!getLabModule(c.code,l.no);
      h+='<tr><td><b>'+l.no+'</b></td><td>'+(has?getLabModule(c.code,l.no).title:l.title)+'</td>';
      h+='<td>'+(has?'<span class="status graded">Đã cấu hình</span>':'<span class="status empty">Chưa có</span>')+'</td>';
      h+='<td><button class="btn-ghost btn-sm" onclick="alert(\'Mỗi bài cần cấu hình riêng trực tiếp trong mã nguồn hệ thống. Liên hệ người phụ trách kỹ thuật để thêm mẫu cho bài này.\')">'+(has?'Sửa':'Tạo')+'</button></td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  document.getElementById('adminBody').innerHTML=h;
}
</script>
<!-- ==================== MODULE TỪNG BÀI THÍ NGHIỆM ====================
     Mỗi bài = 1 file riêng trong thư mục labs/, tự đăng ký qua registerLabModule().
     Danh sách file cần nạp nằm trong labs/manifest.js (KHÔNG nằm trong trang này) —
     từ nay thêm 1 bài mới chỉ cần: (1) tạo file labs/BaiN-....js, (2) thêm đúng 1
     dòng tên file vào labs/manifest.js. Không cần sửa lại trang này nữa, TRỪ KHI
     bài mới cần thêm năng lực mới cho engine (hiếm khi xảy ra). -->
<script src="labs/manifest.js"></script>
<script>
  (window.LAB_FILES||[]).forEach(function(filename){
    var s=document.createElement('script');
    s.src='labs/'+filename;
    /* QUAN TRỌNG: script tạo bằng createElement() mặc định async=true (tải
       xong file nào chạy file đó, KHÔNG theo đúng thứ tự trong danh sách).
       Một số bài (vd Bài 4 gộp PHYS100 dùng lại code Bài 6A/6B qua
       window.Lab6AShared/Lab6BShared) cần file mình phụ thuộc chạy TRƯỚC —
       đặt async=false để trình duyệt tải song song nhưng vẫn CHẠY đúng thứ
       tự khai báo trong manifest.js. */
    s.async=false;
    document.body.appendChild(s);
  });
</script>
